<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tom Riddle's Diary</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&family=Cinzel:wght@600;700;900&family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --parchment-bg: #f2e3c6;
      --ink-color: #1a0f07;
      --riddle-ink: #0d2b1d;
      --gold-accent: #c5a059;
      --dark-leather: #14110f;
      --link-color: #8b4513;
    }

    body {
      background-color: #0a0908;
      background-image: radial-gradient(#1a1614 1px, transparent 0);
      background-size: 24px 24px;
      color: var(--ink-color);
      font-family: 'Kalam', 'Charm', cursive;
      min-height: 100vh;
      padding-bottom: 50px;
    }

    .navbar {
      background-color: var(--dark-leather) !important;
      border-bottom: 2px solid var(--gold-accent);
      box-shadow: 0 4px 15px rgba(0,0,0,0.8);
    }

    .navbar-brand {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--gold-accent) !important;
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(197, 160, 89, 0.4);
    }

    .online-badge {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 1000;
    }

    .online-badge .badge {
      background: var(--dark-leather) !important;
      color: var(--gold-accent) !important;
      border: 1px solid var(--gold-accent);
      font-family: 'Cinzel', serif;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    }

    .post-card, #adminPanel {
      background: var(--parchment-bg);
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(255,255,255,0.2) 0%, rgba(0,0,0,0.05) 100%),
        linear-gradient(to right, rgba(0,0,0,0.05) 0%, transparent 5%, transparent 95%, rgba(0,0,0,0.05) 100%);
      border: 1px solid #b89b5e;
      border-radius: 4px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), inset 0 0 40px rgba(139, 90, 43, 0.15);
      margin-bottom: 2.5rem;
      position: relative;
    }

    .post-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.2);
      pointer-events: none;
    }

    h3.card-title, h5 {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      color: #2b1810;
      border-bottom: 1px dashed var(--gold-accent);
      padding-bottom: 8px;
    }

    .card-text {
      font-size: 1.25rem;
      line-height: 1.8;
      color: var(--ink-color);
      white-space: pre-wrap;
    }

    /* สไตล์สำหรับลิงก์ */
    a.diary-link {
      color: var(--link-color);
      text-decoration: underline;
      font-weight: 700;
      word-break: break-all;
      transition: color 0.2s ease;
    }

    a.diary-link:hover {
      color: #000;
      text-decoration: underline;
    }

    .riddle-response a.diary-link {
      color: var(--riddle-ink);
    }

    .comment-box {
      background: rgba(0, 0, 0, 0.03);
      border-left: 3px solid var(--riddle-ink);
      border-radius: 0;
      padding: 12px 16px;
      margin-top: 14px;
      position: relative;
      animation: inkAbsorb 1.5s ease-in-out forwards;
    }

    .comment-box.riddle-response {
      color: var(--riddle-ink);
      font-weight: 700;
    }

    .comment-box strong {
      font-family: 'Cinzel', serif;
      letter-spacing: 1px;
    }

    /* คอมเมนต์ (คำตอบของ Tom Riddle) ที่ยังรอเจ้าของอนุมัติก่อนเผยแพร่ */
    .comment-box.comment-pending {
      background: rgba(197, 160, 89, 0.18);
      border-left: 3px dashed var(--gold-accent);
    }

    .pending-section {
      border-top: 2px dashed var(--gold-accent);
      margin-top: 14px;
      padding-top: 10px;
    }

    .pending-section h6 {
      font-family: 'Cinzel', serif;
      color: #6b4e2e;
      border-bottom: none;
      padding-bottom: 0;
      margin-bottom: 8px;
    }

    .like-btn {
      border: none;
      background: transparent;
      color: var(--link-color);
      font-family: 'Cinzel', serif;
      font-size: 0.8rem;
      padding: 2px 6px;
      cursor: pointer;
    }

    .like-btn:hover {
      color: #000;
      text-decoration: underline;
    }

    .riddle-response .like-btn {
      color: var(--riddle-ink);
    }

    @keyframes inkAbsorb {
      0% { opacity: 0; filter: blur(3px); }
      100% { opacity: 1; filter: blur(0); }
    }

    .form-control {
      background-color: rgba(255, 255, 255, 0.4);
      border: 1px solid #aa8c55;
      color: var(--ink-color);
      font-family: 'Kalam', cursive;
      font-size: 1.1rem;
    }

    .form-control:focus {
      background-color: rgba(255, 255, 255, 0.7);
      border-color: var(--gold-accent);
      box-shadow: 0 0 8px rgba(197, 160, 89, 0.5);
      color: var(--ink-color);
    }

    .form-control:disabled {
      background-color: rgba(0, 0, 0, 0.05);
      cursor: not-allowed;
    }

    .btn-primary, .btn-success {
      background-color: var(--dark-leather);
      border-color: var(--gold-accent);
      color: var(--gold-accent);
      font-family: 'Cinzel', serif;
      font-size: 0.9rem;
    }

    .btn-primary:hover, .btn-success:hover {
      background-color: var(--gold-accent);
      border-color: var(--dark-leather);
      color: var(--dark-leather);
    }

    .btn-outline-primary {
      color: var(--dark-leather);
      border-color: var(--dark-leather);
      font-family: 'Cinzel', serif;
    }

    .btn-outline-primary:hover {
      background-color: var(--dark-leather);
      color: var(--gold-accent);
    }

    .btn-action-sm {
      font-family: 'Cinzel', serif;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 3px;
    }

    .modal-content {
      background-color: var(--dark-leather);
      border: 1px solid var(--gold-accent);
      color: var(--gold-accent);
      font-family: 'Cinzel', serif;
    }

    .modal-header, .modal-footer {
      border-color: rgba(197, 160, 89, 0.3);
    }

    .post-card.shared-highlight {
      animation: sharedGlow 2.2s ease-out;
    }

    @keyframes sharedGlow {
      0% { box-shadow: 0 0 0 3px var(--gold-accent), 0 10px 30px rgba(0,0,0,0.7); }
      100% { box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), inset 0 0 40px rgba(139, 90, 43, 0.15); }
    }

    .btn-share-sm {
      font-family: 'Cinzel', serif;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 3px;
      color: var(--dark-leather);
      border-color: var(--dark-leather);
    }

    .btn-share-sm:hover {
      background-color: var(--dark-leather);
      color: var(--gold-accent);
    }
  </style>
</head>

<body>

  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="#">📖 T. M. RIDDLE'S DIARY</a>
      <div>
        <button class="btn btn-outline-light btn-sm d-none" id="logoutBtn" onclick="handleLogout()">ปิดสมุด (Logout)</button>
        <button class="btn btn-outline-light btn-sm" id="authBtn" data-bs-toggle="modal"
          data-bs-target="#loginModal">สลักชื่อเจ้าของ (Owner)</button>
      </div>
    </div>
  </nav>

  <div class="online-badge">
    <span class="badge rounded-pill p-2 fs-6">
      ✒️ ผู้เปิดอ่านสมุด: <span id="onlineCount">1</span> คน
    </span>
  </div>

  <div class="container my-4" style="max-width: 800px;">
    <div id="adminPanel" class="card p-4 mb-4 d-none">
      <h5 class="card-title">เขียนข้อความลงบนสมุด (Owner Panel)</h5>
      <div class="mb-2">
        <input type="text" id="postTitle" class="form-control" placeholder="หัวเรื่องข้อความ...">
      </div>
      <div class="mb-2">
        <textarea id="postContent" class="form-control" rows="3" placeholder="จรดปลายปากกาเขียนความลับของคุณที่นี่..."></textarea>
      </div>
      <div class="d-flex justify-content-between">
        <button class="btn btn-primary btn-sm" onclick="createPost()">หยดหมึกลงกระดาษ</button>
        <button class="btn btn-outline-secondary btn-sm" data-bs-toggle="modal"
          data-bs-target="#changePassModal">เปลี่ยนคาถาผ่านทาง</button>
      </div>
    </div>

    <div id="postsContainer"></div>
  </div>

  <!-- Modal แก้ไขบทความ -->
  <div class="modal fade" id="editPostModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">แก้ไขข้อความในสมุด</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <!-- เปลี่ยนไปเก็บ postId แทน index -->
          <input type="hidden" id="editPostId">
          <input type="text" id="editPostTitle" class="form-control mb-2" placeholder="หัวเรื่อง">
          <textarea id="editPostContent" class="form-control" rows="4" placeholder="เนื้อหา"></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">ยกเลิก</button>
          <button type="button" class="btn btn-primary btn-sm" onclick="saveEditPost()">บันทึกการแก้ไข</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal เข้าสู่ระบบ -->
  <div class="modal fade" id="loginModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">ยืนยันตัวตนผู้ครอบครองสมุด</h5>
        </div>
        <div class="modal-body">
          <div id="loginError" class="alert alert-danger d-none py-2"></div>
          <input type="text" id="loginUser" class="form-control mb-2" placeholder="Username" autocomplete="username">
          <input type="password" id="loginPass" class="form-control mb-2" placeholder="Password" autocomplete="current-password">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" id="loginSubmitBtn" onclick="handleLogin()">เปิดสมุด</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal เปลี่ยนรหัสผ่าน -->
  <div class="modal fade" id="changePassModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">เปลี่ยนคำสาปผ่านทาง (Password)</h5>
        </div>
        <div class="modal-body">
          <div id="changePassError" class="alert alert-danger d-none py-2"></div>
          <input type="password" id="newPass" class="form-control mb-2" placeholder="รหัสผ่านใหม่ (อย่างน้อย 8 ตัวอักษร)" autocomplete="new-password">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-success" id="changePassSubmitBtn" onclick="changePassword()">บันทึก</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import * as Y from 'https://esm.sh/yjs@13'
    import { WebsocketProvider } from 'https://esm.sh/y-websocket@1.5'
    import { IndexeddbPersistence } from 'https://esm.sh/y-indexeddb@9'

    const doc = new Y.Doc();
    const provider = new WebsocketProvider(
      'wss://dearai.kaminpos.xyz',
      'my-decentralized-blog-room',
      doc
    );
    const persistence = new IndexeddbPersistence('my-decentralized-blog-db', doc);
    const yPosts = doc.getArray('posts');

    let isLoggedInState = false;

    async function checkSession() {
      try {
        const res = await fetch('/api/session');
        const data = await res.json();
        setLoggedInUI(data.loggedIn);
      } catch (e) {
        setLoggedInUI(false);
      }
    }

    function setLoggedInUI(isLoggedIn) {
      isLoggedInState = isLoggedIn;
      document.getElementById('adminPanel').classList.toggle('d-none', !isLoggedIn);
      document.getElementById('authBtn').classList.toggle('d-none', isLoggedIn);
      document.getElementById('logoutBtn').classList.toggle('d-none', !isLoggedIn);
      renderPosts();
    }

    checkSession();

    provider.awareness.on('change', () => {
      const states = Array.from(provider.awareness.getStates().keys());
      document.getElementById('onlineCount').innerText = states.length;
    });

    yPosts.observeDeep(() => {
      renderPosts();
    });

    let hasScrolledToShared = false;
    persistence.on('synced', () => {
      renderPosts();
      checkAndTriggerAIComments();
      if (!hasScrolledToShared) {
        hasScrolledToShared = true;
        setTimeout(scrollToSharedPost, 150);
      }
    });

    // ฟังก์ชันแปลงข้อความธรรมดา ให้ตัวที่เป็น URL กลายเป็นลิงก์ขีดเส้นใต้ และเปิดหน้าใหม่
    function autoLinkify(text) {
      const escaped = escapeHtml(text);
      const urlRegex = /(https?:\/\/[^\s<]+|www\.[^\s<]+)/g;
      
      return escaped.replace(urlRegex, (url) => {
        const href = url.startsWith('www.') ? `http://${url}` : url;
        return `<a href="${href}" class="diary-link" target="_blank" rel="noopener noreferrer">${url}</a>`;
      });
    }

    // สร้าง markup ของคอมเมนต์ 1 รายการ (ใช้ทั้งกับคอมเมนต์ที่แสดงแล้วและที่รออนุมัติ)
    function renderCommentBox(postId, cIndex, c, pending) {
      const isRiddle = !!c.isAI;
      const likes = c.likes || 0;
      const pendingBadge = pending ? '<span class="badge bg-warning text-dark ms-1">รอการอนุมัติ</span>' : '';

      const approveBtn = (pending && isLoggedInState)
        ? `<button class="btn btn-outline-success btn-action-sm me-1" onclick="approveComment(${postId}, ${cIndex})">✅ อนุมัติ</button>`
        : '';

      const deleteCommentBtn = isLoggedInState
        ? `<button class="btn btn-outline-danger btn-action-sm float-end" onclick="deleteComment(${postId}, ${cIndex})">ลบ</button>`
        : '';

      const likeBtn = !pending
        ? `<button class="like-btn" onclick="likeComment(${postId}, ${cIndex})">🖤 ถูกใจ (${likes})</button>`
        : '';

      return `
        <div class="comment-box ${isRiddle ? 'riddle-response' : ''} ${pending ? 'comment-pending' : ''}">
          ${deleteCommentBtn}
          <strong>${escapeHtml(c.author)}</strong> <small class="text-muted">• ${c.date}</small>${pendingBadge}
          <p class="mb-1 mt-1">${autoLinkify(c.text)}</p>
          <div class="d-flex align-items-center gap-2">
            ${likeBtn}
            ${approveBtn}
          </div>
        </div>
      `;
    }

    window.renderPosts = function () {
      const container = document.getElementById('postsContainer');
      container.innerHTML = '';

      const rawPosts = yPosts.toArray();

      // แสดงผลเรียงจาก ใหม่สุด ไป หาเก่าสุด
      // คัดลอกพร้อมอ้างอิง postId โดยตรง
      [...rawPosts].reverse().forEach((post) => {
        const postId = post.id;
        const postCard = document.createElement('div');
        postCard.className = 'card post-card p-3';
        postCard.id = `post-${postId}`;

        const comments = post.comments || [];

        // คอมเมนต์ของเจ้าของแสดงทันที ส่วนคำตอบของ Tom Riddle (AI) ต้องรอเจ้าของอนุมัติก่อน
        // (คอมเมนต์เก่าที่ไม่มีฟิลด์ approved จะถือว่าอนุมัติแล้ว เพื่อไม่ให้ข้อมูลเดิมหายไป)
        const visibleHTML = comments
          .map((c, cIndex) => ({ c, cIndex }))
          .filter(({ c }) => c.approved !== false)
          .map(({ c, cIndex }) => renderCommentBox(postId, cIndex, c, false))
          .join('');

        const pendingItems = comments
          .map((c, cIndex) => ({ c, cIndex }))
          .filter(({ c }) => c.approved === false);

        const pendingHTML = (isLoggedInState && pendingItems.length > 0) ? `
          <div class="pending-section">
            <h6>คำตอบจาก Tom Riddle ที่รอการอนุมัติ (${pendingItems.length})</h6>
            ${pendingItems.map(({ c, cIndex }) => renderCommentBox(postId, cIndex, c, true)).join('')}
          </div>` : '';

        const disabledAttr = isLoggedInState ? '' : 'disabled';
        const placeholderAuthor = isLoggedInState ? 'นามของคุณ' : 'ต้องเปิดสมุดก่อน';
        const placeholderText = isLoggedInState ? 'เขียนตอบกลับทอม ริดเดิล...' : '🔒 กรุณาลงชื่อเข้าใช้ (Login) เพื่อจรดข้อความ...';

        // ใช้ postId อ้างอิงแทน index ในปุ่ม Action
        const postAdminControls = isLoggedInState ? `
          <div class="float-end">
            <button class="btn btn-outline-warning btn-action-sm me-1" onclick="openEditModal(${postId})">✏️ แก้ไข</button>
            <button class="btn btn-outline-danger btn-action-sm" onclick="deletePost(${postId})">🗑️ ลบ</button>
          </div>
        ` : '';

        postCard.innerHTML = `
          <div class="card-body">
            ${postAdminControls}
            <button class="btn btn-outline-primary btn-share-sm float-end me-1" onclick="sharePost(${postId})">🔗 แชร์โพสต์นี้</button>
            <h3 class="card-title">${escapeHtml(post.title)}</h3>
            <p class="card-text">${autoLinkify(post.content)}</p>
            <button class="like-btn" onclick="likePost(${postId})">🖤 ถูกใจข้อความนี้ (${post.likes || 0})</button>
            <hr style="border-color: var(--gold-accent);">
            <h5>ข้อความตอบกลับจากสมุดบันทึก</h5>
            <div class="mb-3">${visibleHTML || '<small class="text-muted" style="font-style: italic;">กระดาษยังคงว่างเปล่า... รอคอยหมึกซึมผ่าน</small>'}</div>
            ${pendingHTML}
            <div class="input-group mb-3">
              <input type="text" id="author-${postId}" class="form-control" placeholder="${placeholderAuthor}" style="max-width: 160px;" ${disabledAttr}>
              <input type="text" id="input-${postId}" class="form-control" placeholder="${placeholderText}" ${disabledAttr}>
              <button class="btn btn-outline-primary" onclick="addComment(${postId})" ${disabledAttr}>สื่อสาร</button>
            </div>
          </div>
        `;
        container.appendChild(postCard);
      });
    };

    window.sharePost = async function (postId) {
      const url = new URL(window.location.href);
      url.hash = '';
      url.searchParams.set('post', postId);
      const shareUrl = url.toString();

      if (navigator.share) {
        try {
          await navigator.share({ url: shareUrl, title: "T. M. Riddle's Diary" });
          return;
        } catch (e) {
          // ผู้ใช้กดยกเลิก share sheet หรืออุปกรณ์ไม่รองรับ ให้ fallback ไป copy แทน
        }
      }

      try {
        await navigator.clipboard.writeText(shareUrl);
        alert('คัดลอกลิงก์โพสต์นี้แล้ว ✒️');
      } catch (e) {
        prompt('คัดลอกลิงก์นี้ด้วยตนเอง:', shareUrl);
      }
    };

    function scrollToSharedPost() {
      const params = new URLSearchParams(window.location.search);
      const targetId = params.get('post');
      if (!targetId) return;

      const el = document.getElementById(`post-${targetId}`);
      if (!el) return;

      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      el.classList.add('shared-highlight');
      setTimeout(() => el.classList.remove('shared-highlight'), 2200);
    }

    window.deletePost = function (postId) {
      if (!isLoggedInState) return;
      const index = yPosts.toArray().findIndex(p => p.id === postId);
      if (index === -1) return alert('ไม่พบโพสต์นี้ หรืออาจถูกลบไปแล้ว');

      if (confirm('คุณต้องการลบข้อความนี้ออกจากสมุดบันทึกใช่หรือไม่?')) {
        yPosts.delete(index, 1);
      }
    };

    window.openEditModal = function (postId) {
      if (!isLoggedInState) return;
      const index = yPosts.toArray().findIndex(p => p.id === postId);
      if (index === -1) return alert('ไม่พบโพสต์นี้ หรืออาจถูกลบไปแล้ว');

      const targetPost = yPosts.get(index);
      document.getElementById('editPostId').value = postId;
      document.getElementById('editPostTitle').value = targetPost.title;
      document.getElementById('editPostContent').value = targetPost.content;
      
      const modal = new bootstrap.Modal(document.getElementById('editPostModal'));
      modal.show();
    };

    window.saveEditPost = function () {
      if (!isLoggedInState) return;
      const postId = Number(document.getElementById('editPostId').value);
      const newTitle = document.getElementById('editPostTitle').value.trim();
      const newContent = document.getElementById('editPostContent').value.trim();

      if (!newTitle || !newContent) return alert('กรุณากรอกข้อมูลให้ครบถ้วน');

      const index = yPosts.toArray().findIndex(p => p.id === postId);
      if (index === -1) return alert('โพสต์นี้ถูกลบไปแล้ว');

      const targetPost = yPosts.get(index);
      targetPost.title = newTitle;
      targetPost.content = newContent;

      yPosts.delete(index, 1);
      yPosts.insert(index, [targetPost]);

      bootstrap.Modal.getInstance(document.getElementById('editPostModal')).hide();
    };

    window.deleteComment = function (postId, commentIndex) {
      if (!isLoggedInState) return;
      const index = yPosts.toArray().findIndex(p => p.id === postId);
      if (index === -1) return alert('โพสต์นี้ถูกลบไปแล้ว');

      if (confirm('คุณต้องการลบข้อความตอบกลับนี้ใช่หรือไม่?')) {
        const targetPost = yPosts.get(index);
        targetPost.comments.splice(commentIndex, 1);

        yPosts.delete(index, 1);
        yPosts.insert(index, [targetPost]);
      }
    };

    // เจ้าของกดอนุมัติคำตอบของ Tom Riddle (AI) ให้แสดงต่อสาธารณะ
    window.approveComment = function (postId, commentIndex) {
      if (!isLoggedInState) return;
      const index = yPosts.toArray().findIndex(p => p.id === postId);
      if (index === -1) return;

      const targetPost = yPosts.get(index);
      if (!targetPost.comments || !targetPost.comments[commentIndex]) return;
      targetPost.comments[commentIndex].approved = true;

      yPosts.delete(index, 1);
      yPosts.insert(index, [targetPost]);
    };

    // กดถูกใจข้อความในไดอารี
    window.likePost = function (postId) {
      const index = yPosts.toArray().findIndex(p => p.id === postId);
      if (index === -1) return;

      const targetPost = yPosts.get(index);
      targetPost.likes = (targetPost.likes || 0) + 1;

      yPosts.delete(index, 1);
      yPosts.insert(index, [targetPost]);
    };

    // กดถูกใจคอมเมนต์ (บทสนทนาระหว่างเจ้าของกับ Tom Riddle)
    window.likeComment = function (postId, commentIndex) {
      const index = yPosts.toArray().findIndex(p => p.id === postId);
      if (index === -1) return;

      const targetPost = yPosts.get(index);
      if (!targetPost.comments || !targetPost.comments[commentIndex]) return;

      const c = targetPost.comments[commentIndex];
      if (c.approved === false) return; // กันไลค์คอมเมนต์ที่ยังไม่อนุมัติ
      c.likes = (c.likes || 0) + 1;

      yPosts.delete(index, 1);
      yPosts.insert(index, [targetPost]);
    };

    window.createPost = function () {
      const title = document.getElementById('postTitle').value;
      const content = document.getElementById('postContent').value;
      if (!title || !content) return alert('กรุณาจรดข้อความให้ครบถ้วน');

      yPosts.push([{
        id: Date.now(),
        title,
        content,
        comments: [],
        likes: 0,
        lastAICommentDate: null
      }]);

      document.getElementById('postTitle').value = '';
      document.getElementById('postContent').value = '';
      checkAndTriggerAIComments();
    };

    window.addComment = async function (postId) {
      if (!isLoggedInState) {
        alert('เฉพาะผู้ที่สลักชื่อเจ้าของ (Login) แล้วเท่านั้นที่จะเขียนตอบกลับสมุดเล่มนี้ได้');
        return;
      }

      const index = yPosts.toArray().findIndex(p => p.id === postId);
      if (index === -1) return alert('โพสต์นี้ถูกลบไปแล้ว');

      const authorInput = document.getElementById(`author-${postId}`);
      const textInput = document.getElementById(`input-${postId}`);
      const author = authorInput.value.trim() || 'ผู้เขียนลึกลับ';
      const text = textInput.value.trim();

      if (!text) return;

      const targetPost = yPosts.get(index);
      targetPost.comments.push({
        author,
        text,
        date: new Date().toLocaleTimeString(),
        approved: true, // ข้อความของเจ้าของสมุด (login แล้ว) แสดงได้ทันที ไม่ต้องรออนุมัติ
        likes: 0,
        isAI: false
      });

      targetPost.lastAICommentDate = null;

      yPosts.delete(index, 1);
      yPosts.insert(index, [targetPost]);

      checkAndTriggerAIComments();
    };

    window.handleLogin = async function () {
      const u = document.getElementById('loginUser').value;
      const p = document.getElementById('loginPass').value;
      const errorBox = document.getElementById('loginError');
      const btn = document.getElementById('loginSubmitBtn');

      errorBox.classList.add('d-none');
      btn.disabled = true;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p })
        });
        const data = await res.json();

        if (!res.ok) {
          errorBox.textContent = data.error || 'การยืนยันตัวตนล้มเหลว';
          errorBox.classList.remove('d-none');
          return;
        }

        setLoggedInUI(true);
        document.getElementById('loginUser').value = '';
        document.getElementById('loginPass').value = '';
        bootstrap.Modal.getInstance(document.getElementById('loginModal')).hide();
      } catch (e) {
        errorBox.textContent = 'เกิดข้อผิดพลาดทางเวทมนตร์ในการเชื่อมต่อ';
        errorBox.classList.remove('d-none');
      } finally {
        btn.disabled = false;
      }
    };

    window.handleLogout = async function () {
      try {
        await fetch('/api/logout', { method: 'POST' });
      } finally {
        setLoggedInUI(false);
      }
    };

    window.changePassword = async function () {
      const newP = document.getElementById('newPass').value;
      const errorBox = document.getElementById('changePassError');
      const btn = document.getElementById('changePassSubmitBtn');

      errorBox.classList.add('d-none');
      if (!newP) return;
      btn.disabled = true;

      try {
        const res = await fetch('/api/change-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ newPassword: newP })
        });
        const data = await res.json();

        if (!res.ok) {
          errorBox.textContent = data.error || 'ไม่สามารถเปลี่ยนคาถาผ่านทางได้';
          errorBox.classList.remove('d-none');
          return;
        }

        alert('เปลี่ยนคาถาผ่านทางเรียบร้อยแล้ว');
        document.getElementById('newPass').value = '';
        bootstrap.Modal.getInstance(document.getElementById('changePassModal')).hide();
      } catch (e) {
        errorBox.textContent = 'เกิดข้อผิดพลาดในการเชื่อมต่อ';
        errorBox.classList.remove('d-none');
      } finally {
        btn.disabled = false;
      }
    };

    async function queryHuggingFace(promptText) {
      const response = await fetch("/api/ai-comment", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content: promptText })
      });

      if (!response.ok) {
        throw new Error("Failed to fetch AI comment");
      }

      const result = await response.json();
      return result[0]?.generated_text || "ฉันเห็นความปรารถนาในใจของเธอ... เล่าให้ฉันฟังมากกว่านี้สิ";
    }

    async function checkAndTriggerAIComments() {
      const today = new Date().toISOString().split('T')[0];
      const postsArray = yPosts.toArray();

      for (let i = 0; i < postsArray.length; i++) {
        const post = postsArray[i];

        if (post.lastAICommentDate !== today) {
          try {
            const lastMessage = post.comments.length > 0 
              ? post.comments[post.comments.length - 1].text 
              : post.content;

            const rawText = await queryHuggingFace(lastMessage);
            const cleanText = rawText
              .replace(/\[\/?INST\]/g, '')
              .replace(/<s>|<\/s>/g, '')
              .trim();

            const botName = "Tom Marvolo Riddle ✒️";

            post.comments.push({
              author: botName,
              text: cleanText || "ฉันเห็นความปรารถนาในใจของเธอ... เล่าให้ฉันฟังมากกว่านี้สิ",
              date: new Date().toLocaleTimeString(),
              approved: false, // คำตอบของ Tom Riddle ต้องรอเจ้าของสมุดอนุมัติก่อนเผยแพร่
              likes: 0,
              isAI: true
            });
            post.lastAICommentDate = today;

            yPosts.delete(i, 1);
            yPosts.insert(i, [post]);
          } catch (err) {
            console.error("Tom Riddle Memory Error:", err);
          }
        }
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    provider.on('status', event => {
      let logBox = document.getElementById('debug-status');
      if (!logBox) {
        logBox = document.createElement('div');
        logBox.id = 'debug-status';
        logBox.style = 'position:fixed; top:10px; left:10px; background:rgba(20,17,15,0.9); color:#c5a059; padding:5px 10px; border:1px solid #c5a059; border-radius:5px; font-size:12px; font-family:Cinzel, serif; z-index:9999;';
        document.body.appendChild(logBox);
      }

      if (event.status === 'connected') {
        logBox.innerHTML = '✨ สันธานเวท: เชื่อมต่อสมุดแล้ว';
        logBox.style.color = '#76ba99';
      } else {
        logBox.innerHTML = '⚡ สันธานเวท: ขาดการเชื่อมต่อ';
        logBox.style.color = '#ac4747';
      }
    });
  </script>
</body>
