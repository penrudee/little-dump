<!-- index.html  -->
<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P2P Web Blog with Yjs & Cloudflare Functions</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }

    .online-badge {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 1000;
    }

    .post-card {
      margin-bottom: 2rem;
    }

    .comment-box {
      background: #f1f3f5;
      border-radius: 8px;
      padding: 12px;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">My Decent Blog</a>
      <button class="btn btn-outline-light btn-sm" id="authBtn" data-bs-toggle="modal"
        data-bs-target="#loginModal">Owner Login</button>
    </div>
  </nav>

  <div class="online-badge">
    <span class="badge rounded-pill bg-success p-2 fs-6 shadow">
      🟢 ออนไลน์อยู่: <span id="onlineCount">1</span> คน
    </span>
  </div>

  <div class="container my-4">
    <div id="adminPanel" class="card p-3 mb-4 d-none border-primary shadow-sm">
      <h5 class="card-title text-primary">จัดการบทความ (Owner Panel)</h5>
      <div class="mb-2">
        <input type="text" id="postTitle" class="form-control" placeholder="หัวข้อบทความ">
      </div>
      <div class="mb-2">
        <textarea id="postContent" class="form-control" rows="3" placeholder="เนื้อหาบทความ..."></textarea>
      </div>
      <div class="d-flex justify-content-between">
        <button class="btn btn-primary btn-sm" onclick="createPost()">เผยแพร่บทความ</button>
        <button class="btn btn-outline-secondary btn-sm" data-bs-toggle="modal"
          data-bs-target="#changePassModal">เปลี่ยนรหัสผ่าน</button>
      </div>
    </div>

    <div id="postsContainer"></div>
  </div>

  <div class="modal fade" id="loginModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">เข้าสู่ระบบเจ้าของบล็อก</h5>
        </div>
        <div class="modal-body">
          <input type="text" id="loginUser" class="form-control mb-2" placeholder="Username">
          <input type="password" id="loginPass" class="form-control mb-2" placeholder="Password">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" onclick="handleLogin()">เข้าสู่ระบบ</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="changePassModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">เปลี่ยนรหัสผ่าน Admin</h5>
        </div>
        <div class="modal-body">
          <input type="password" id="newPass" class="form-control mb-2" placeholder="รหัสผ่านใหม่">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-success" onclick="changePassword()">บันทึก</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import * as Y from 'https://esm.sh/yjs@13'
    import {WebsocketProvider} from 'https://esm.sh/y-websocket@1.5'
    import {IndexeddbPersistence} from 'https://esm.sh/y-indexeddb@9'

    // 1. ตั้งค่า Yjs, IndexedDB และ y-websocket
    const doc = new Y.Doc();

    // พารามิเตอร์ของ WebsocketProvider: (Server_URL, Room_Name, Y.Doc)
    const provider = new WebsocketProvider(
      'wss://dearai.kaminpos.xyz',   // Server URL ของ Termux/Server คุณ
      'my-decentralized-blog-room',  // ชื่อ Room
      doc                            // Y.Doc Object
    );

    const persistence = new IndexeddbPersistence('my-decentralized-blog-db', doc);
    const yPosts = doc.getArray('posts');



    // 3. แสดงจำนวนผู้ใช้งานที่กำลังออนไลน์ (Awareness)
    provider.awareness.on('change', () => {
      const states = Array.from(provider.awareness.getStates().keys());
      document.getElementById('onlineCount').innerText = states.length;
    });

    // 4. Render เมื่อข้อมูลเปลี่ยนหรือโหลดสำเร็จ
    yPosts.observeDeep(() => {
      renderPosts();
    });

    persistence.on('synced', () => {
      renderPosts();
      checkAndTriggerAIComments();
    });

    window.renderPosts = function () {
      const container = document.getElementById('postsContainer');
      container.innerHTML = '';

      yPosts.toArray().forEach((post, index) => {
        const postCard = document.createElement('div');
        postCard.className = 'card post-card shadow-sm';

        let commentsHTML = (post.comments || []).map(c => `
          <div class="comment-box">
            <strong>${escapeHtml(c.author)}</strong> <small class="text-muted">• ${c.date}</small>
            <p class="mb-0 mt-1">${escapeHtml(c.text)}</p>
          </div>
        `).join('');

        postCard.innerHTML = `
          <div class="card-body">
            <h3 class="card-title">${escapeHtml(post.title)}</h3>
            <p class="card-text">${escapeHtml(post.content)}</p>
            <hr>
            <h5>ความคิดเห็น</h5>
            <div class="mb-3">${commentsHTML || '<small class="text-muted">ยังไม่มีความคิดเห็น</small>'}</div>
            <div class="input-group mb-3">
              <input type="text" id="author-${index}" class="form-control" placeholder="ชื่อของคุณ" style="max-width: 150px;">
              <input type="text" id="input-${index}" class="form-control" placeholder="เขียนความคิดเห็น...">
              <button class="btn btn-outline-primary" onclick="addComment(${index})">ส่ง</button>
            </div>
          </div>
        `;
        container.appendChild(postCard);
      });
    };

    // 5. ฟังก์ชันเพิ่มบทความและคอมเมนต์
    window.createPost = function () {
      const title = document.getElementById('postTitle').value;
      const content = document.getElementById('postContent').value;
      if (!title || !content) return alert('กรอกข้อมูลให้ครบถ้วน');

      yPosts.push([{
        id: Date.now(),
        title,
        content,
        comments: [],
        lastAICommentDate: null
      }]);

      document.getElementById('postTitle').value = '';
      document.getElementById('postContent').value = '';
      checkAndTriggerAIComments();
    };

    window.addComment = function (postIndex) {
      const authorInput = document.getElementById(`author-${postIndex}`);
      const textInput = document.getElementById(`input-${postIndex}`);
      const author = authorInput.value.trim() || 'ผู้เยี่ยมชม';
      const text = textInput.value.trim();

      if (!text) return;

      const postsArray = yPosts.toArray();
      const targetPost = postsArray[postIndex];
      targetPost.comments.push({
        author,
        text,
        date: new Date().toLocaleTimeString()
      });

      yPosts.delete(postIndex, 1);
      yPosts.insert(postIndex, [targetPost]);
    };

    // 6. ระบบยืนยันตัวตน
    window.handleLogin = function () {
      const u = document.getElementById('loginUser').value;
      const p = document.getElementById('loginPass').value;
      if (u === localStorage.getItem('admin_user') && p === localStorage.getItem('admin_pass')) {
        document.getElementById('adminPanel').classList.remove('d-none');
        document.getElementById('authBtn').innerText = 'Owner Logged In';
        document.getElementById('authBtn').disabled = true;
        bootstrap.Modal.getInstance(document.getElementById('loginModal')).hide();
      } else {
        alert('Username หรือ Password ไม่ถูกต้อง');
      }
    };

    window.changePassword = function () {
      const newP = document.getElementById('newPass').value;
      if (newP) {
        localStorage.setItem('admin_pass', newP);
        alert('เปลี่ยนรหัสผ่านเรียบร้อยแล้ว');
        bootstrap.Modal.getInstance(document.getElementById('changePassModal')).hide();
      }
    };

    // 7. การเชื่อมต่อ Cloudflare Pages Function เพื่อรับคอมเมนต์จาก AI
    const AI_BOT_NAMES = ['สมชาย สายอ่าน', 'กูรูวรรณกรรม', 'นักคิดเมืองกรุง', 'สายซุ่มอ่าน', 'ผู้ท่องโลกกว้าง', 'แมวเก้าชีวิต', 'หนุ่มเมืองกรุง', 'สาวน้อยบนยอดดอย', 'นักเวทย์จากราชสำนักหลวง'];

    // async function queryHuggingFace(promptText) {
    //   const response = await fetch("/ai-comment", {
    //     method: "POST",
    //     headers: { "Content-Type": "application/json" },
    //     body: JSON.stringify({ content: promptText })
    //   });
    async function queryHuggingFace(promptText) {
      const response = await fetch("/api/ai-comment", {   
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({content: promptText})
      });
      if (!response.ok) {
        throw new Error("Failed to fetch AI comment from Serverless Function");
      }

      const result = await response.json();
      return result[0]?.generated_text || "เป็นบทความที่น่าสนใจมากครับ!";
    }

    async function checkAndTriggerAIComments() {
      const today = new Date().toISOString().split('T')[0];
      const postsArray = yPosts.toArray();

      for (let i = 0; i < postsArray.length; i++) {
        const post = postsArray[i];

        // ส่งขอคอมเมนต์จาก AI เพียงวันละ 1 ครั้งต่อ 1 บทความ
        if (post.lastAICommentDate !== today) {
          try {
            const rawText = await queryHuggingFace(post.content);
            const cleanText = rawText.replace(/\[\/?INST\]/g, '').split('\n').pop();
            const randomName = AI_BOT_NAMES[Math.floor(Math.random() * AI_BOT_NAMES.length)] + " 🤖";

            post.comments.push({
              author: randomName,
              text: cleanText,
              date: new Date().toLocaleTimeString()
            });
            post.lastAICommentDate = today;

            yPosts.delete(i, 1);
            yPosts.insert(i, [post]);
          } catch (err) {
            console.error("AI Comment Error:", err);
          }
        }
      }
    }
    
    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
    // สร้าง Event ตรวจสอบการเชื่อมต่อ WebSocket และแสดงผลบนหน้าจอ
    provider.on('status', event => {
      console.log('WebRTC Status:', event.status); // connected หรือ disconnected

      // สร้าง/อัปเดตกล่อง Log บนหน้าจอมือถือ
      let logBox = document.getElementById('debug-status');
      if (!logBox) {
        logBox = document.createElement('div');
        logBox.id = 'debug-status';
        logBox.style = 'position:fixed; top:10px; left:10px; background:rgba(0,0,0,0.8); color:#fff; padding:5px 10px; border-radius:5px; font-size:12px; z-index:9999;';
        document.body.appendChild(logBox);
      }

      if (event.status === 'connected') {
        logBox.innerHTML = '🟢 WS: Connected';
        logBox.style.color = '#00ff00';
      } else {
        logBox.innerHTML = '🔴 WS: Disconnected';
        logBox.style.color = '#ff4444';
      }
    });
  </script>
</body>

</html>
